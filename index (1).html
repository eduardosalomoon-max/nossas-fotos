<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fbac6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fotos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<title>Nossas fotos</title>
<style>
:root{--s1:#a8e0e5;--s2:#4a96ac;--deep:#0b3441;--mint:#3cf0b0;--foam:#f2fdfd;--glass:rgba(242,253,253,.6);--fg:var(--deep);--shadow:rgba(11,52,65,.5);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--s1:#15434f;--s2:#071e26;--fg:#e8fbfb;--glass:rgba(7,30,38,.65);--shadow:rgba(0,0,0,.6)}}
*,*::before,*::after{box-sizing:inherit}
html{background:linear-gradient(165deg,var(--s1),var(--s2));min-height:100%}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.4 "Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.hide{display:none!important}
svg{display:block}

/* cabeçalho */
header{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 22px 10px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;font-weight:800;letter-spacing:-.035em}
.under{width:150px;height:12px;margin-top:6px;stroke:var(--mint);fill:none;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 2px 3px var(--shadow))}
#count{margin:10px 0 0;opacity:.8;font-weight:500}
.link{background:none;border:0;padding:8px 4px;text-decoration:underline;text-underline-offset:3px;opacity:.85}

/* álbum */
.day{max-width:900px;margin:0 auto;padding:18px 22px 6px}
.day h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.day h2 span{font-size:.9rem;font-weight:500;opacity:.7}
.mosaic{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mosaic>:first-child{grid-column:span 2}
@media (min-width:700px){.mosaic{grid-template-columns:repeat(4,1fr)}.mosaic>:first-child{grid-column:span 2;grid-row:span 2}}
.frame{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;overflow:hidden;background:rgba(255,255,255,.25);
 border:4px solid var(--mint);border-radius:10px 28px 12px 24px/24px 10px 26px 12px;box-shadow:0 14px 26px -14px var(--shadow);transition:transform .18s}
.mosaic>:nth-child(even) .frame{border-radius:26px 10px 24px 12px/10px 24px 12px 26px}
.mosaic>:nth-child(3n) .frame{border-radius:14px 22px 10px 28px/28px 12px 22px 10px}
.frame:active{transform:scale(.97)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.frame img.on{opacity:1}
.time{position:absolute;left:10px;bottom:10px;padding:3px 10px;border-radius:99px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.8rem;font-weight:600;color:var(--fg)}
.empty{max-width:340px;margin:30px auto;padding:0 22px;text-align:center}
.empty .frame{pointer-events:none;background:transparent;box-shadow:none;margin-bottom:18px}
.empty p{margin:0}

/* barra de ações */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:9px;border-radius:99px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 34px -12px var(--shadow)}
.pick{width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.35);display:grid;place-items:center}
.shoot{height:58px;padding:0 28px 0 22px;border-radius:99px;border:0;background:var(--mint);color:var(--deep);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:10px;box-shadow:0 8px 18px -6px rgba(60,240,176,.8)}
.shoot:active,.pick:active{transform:scale(.95)}
.pick svg,.shoot svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:600;box-shadow:0 10px 24px -10px var(--shadow);z-index:5}

/* login */
.box{max-width:380px;margin:0 auto;padding:11vh 24px 0}
.box .frame{width:150px;margin:0 auto 26px;display:grid;place-items:center;pointer-events:none}
.box .frame svg{width:56px;height:56px;stroke:var(--mint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box h1{text-align:center}
.box p.sub{text-align:center;margin:16px 0 22px;opacity:.85}
.box label{font-weight:600;font-size:.95rem}
.box input{width:100%;padding:15px 16px;margin:6px 0 16px;border-radius:16px;border:3px solid transparent;background:var(--glass);color:var(--fg);font:inherit;backdrop-filter:blur(10px)}
.box input:focus{border-color:var(--mint)}
.main{width:100%;height:58px;border-radius:99px;border:0;background:var(--mint);color:var(--deep);font-weight:800;font-size:1.05rem;box-shadow:0 8px 18px -6px rgba(60,240,176,.8)}
.msg{min-height:1.4em;text-align:center;font-weight:600}
code{background:var(--glass);padding:2px 6px;border-radius:6px}

/* foto ampliada */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:visible;color:#fff}
dialog::backdrop{background:rgba(3,18,23,.9);backdrop-filter:blur(6px)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
dialog img{max-width:92vw;max-height:78vh;border:4px solid var(--mint);border-radius:14px 30px 14px 26px/26px 14px 28px 14px;display:block;margin:0 auto}
#cap{text-align:center;margin:14px 0 0;font-weight:600}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:var(--glass);color:var(--fg);font-size:1.6rem;line-height:1}
#prev{left:8px}#next{right:8px}
.acts{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.acts button{padding:12px 18px;border-radius:99px;border:0;background:var(--glass);color:var(--fg);font-weight:700}
#heart.on{background:var(--mint);color:var(--deep)}
#del{color:#c62828}
@media (prefers-color-scheme:dark){#del{color:#ff9a9a}}
.fav{position:absolute;right:12px;top:8px;font-size:1.4rem;color:var(--mint);text-shadow:0 1px 5px var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="setup" class="box hide">
  <h1>Falta configurar</h1>
  <p class="sub">Abra o <code>index.html</code> e cole a URL e a chave do seu projeto Supabase no começo do script. O passo a passo está no README.</p>
</section>

<section id="login" class="box hide">
  <div class="frame"><svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.1-1.6A1 1 0 0 1 9.1 4h5.8a1 1 0 0 1 .8.4L16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
  <h1 style="font-size:2.6rem">Nossas fotos</h1>
  <p class="sub">Entre com o e-mail e a senha que você cadastrou.</p>
  <form id="f">
    <label for="em">E-mail</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="main" type="submit">Entrar</button>
  </form>
  <p class="msg" id="lmsg" role="alert"></p>
</section>

<main id="app" class="hide">
  <header>
    <div>
      <h1>Nossas<br>fotos</h1>
      <svg class="under" viewBox="0 0 160 12" aria-hidden="true"><path d="M3 8C30 2 60 11 90 6s50-2 67 1"/></svg>
      <p id="count"></p>
    </div>
    <div><button class="link" id="favs">Favoritas</button><button class="link" id="out">Sair</button></div>
  </header>

  <div id="empty" class="empty hide">
    <div class="frame" aria-hidden="true"></div>
    <p><strong>Sua primeira foto aparece aqui.</strong><br>Toque em “Tirar foto” para começar o álbum.</p>
  </div>
  <div id="days"></div>

  <div class="dock">
    <button class="pick" id="gal" aria-label="Escolher da galeria"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 9"/></svg></button>
    <button class="shoot" id="cam"><svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.1-1.6A1 1 0 0 1 9.1 4h5.8a1 1 0 0 1 .8.4L16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>Tirar foto</button>
  </div>
  <div class="toast hide" id="toast" role="status"></div>
  <input id="fc" type="file" accept="image/*" capture="environment" class="hide">
  <input id="fg" type="file" accept="image/*" multiple class="hide">
</main>

<dialog id="dlg">
  <img id="big" alt="Foto ampliada">
  <p id="cap"></p>
  <div class="acts"><button id="heart">♡ Favoritar</button><button id="note">Legenda</button><button id="del">Apagar</button></div>
  <button class="nav" id="prev" aria-label="Foto anterior">‹</button>
  <button class="nav" id="next" aria-label="Próxima foto">›</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// COLE AQUI os dados do seu projeto Supabase (Project Settings > API)
const SUPABASE_URL = "https://dgmgtavfjxwryynnxqlt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pN3ikePfiSEt4tJ4LtCgPw_vix1RKcx";

const $ = s => document.querySelector(s);
const show = id => ["setup","login","app"].forEach(x => $("#"+x).classList.toggle("hide", x !== id));
let db, items = [], cur = 0, onlyFav = false, dirty = false, rt;

async function init(){
  if (SUPABASE_URL.startsWith("COLE")) return show("setup");
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data:{ session } } = await db.auth.getSession();
  session ? enter() : show("login");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.toggle("hide", !t); }

$("#f").onsubmit = async e => {
  e.preventDefault(); $("#lmsg").textContent = "Entrando…";
  const { error } = await db.auth.signInWithPassword({ email:$("#em").value, password:$("#pw").value });
  if (error) $("#lmsg").textContent = "E-mail ou senha incorretos."; else enter();
};
$("#out").onclick = async () => { await db.auth.signOut(); show("login"); $("#lmsg").textContent = ""; };
async function enter(){
  show("app"); await load();
  if (!rt) rt = db.channel("fotos").on("postgres_changes", { event:"*", schema:"public", table:"fotos" }, () => { clearTimeout(rt._t); rt._t = setTimeout(load, 400); }).subscribe();
}

const dayName = d => {
  const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d); x.setHours(0,0,0,0);
  const n = Math.round((t - x) / 864e5);
  return n === 0 ? "Hoje" : n === 1 ? "Ontem" : x.toLocaleDateString("pt-BR", { day:"numeric", month:"long" });
};
const hour = d => new Date(d).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });

async function load(){
  if ($("#dlg").open){ dirty = true; return; }
  const { data, error } = await db.from("fotos").select("id,path,created_at,legenda,favorita").order("created_at",{ascending:false});
  if (error) return toast("Não consegui carregar as fotos. Confira o README.");
  const rows = onlyFav ? data.filter(f => f.favorita) : data;
  $("#empty").classList.toggle("hide", data.length > 0);
  $("#count").textContent = data.length ? `${data.length} ${data.length === 1 ? "foto guardada" : "fotos guardadas"}` : "";
  if (onlyFav && !rows.length) toast("Nenhuma favorita ainda. Abra uma foto e toque no coração.");
  const box = $("#days"); box.innerHTML = ""; items = [];
  if (!rows.length) return;
  const { data: urls } = await db.storage.from("fotos").createSignedUrls(rows.map(f => f.path), 3600);
  let lastKey = "", mosaic;
  rows.forEach((f, i) => {
    const url = urls && urls[i] && urls[i].signedUrl; if (!url) return;
    const key = new Date(f.created_at).toDateString();
    if (key !== lastKey){
      lastKey = key;
      const sec = document.createElement("section"); sec.className = "day";
      const hd = document.createElement("h2"); hd.innerHTML = "<b></b><span></span>"; hd.firstChild.textContent = dayName(f.created_at);
      mosaic = document.createElement("div"); mosaic.className = "mosaic";
      sec.append(hd, mosaic); box.appendChild(sec);
    }
    const n = items.push({ id:f.id, path:f.path, url, date:f.created_at, legenda:f.legenda, favorita:f.favorita }) - 1;
    const b = document.createElement("button"); b.className = "frame"; b.setAttribute("aria-label", "Ampliar foto");
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.onload = () => img.classList.add("on"); img.src = url;
    const tm = document.createElement("span"); tm.className = "time"; tm.textContent = hour(f.created_at);
    b.append(img, tm);
    if (f.favorita){ const hr = document.createElement("span"); hr.className = "fav"; hr.textContent = "♥"; b.appendChild(hr); }
    b.onclick = () => open(n); mosaic.appendChild(b);
    const c = mosaic.children.length; mosaic.previousSibling.lastChild.textContent = `${c} ${c === 1 ? "foto" : "fotos"}`;
  });
}

function open(i){
  cur = (i + items.length) % items.length; const it = items[cur];
  $("#big").src = it.url;
  $("#cap").textContent = `${dayName(it.date)}, ${hour(it.date)}` + (it.legenda ? ` · ${it.legenda}` : "");
  $("#heart").classList.toggle("on", !!it.favorita); $("#heart").textContent = it.favorita ? "♥ Favorita" : "♡ Favoritar";
  if (!$("#dlg").open) $("#dlg").showModal();
  $("#prev").classList.toggle("hide", items.length < 2); $("#next").classList.toggle("hide", items.length < 2);
}
$(".acts").onclick = e => e.stopPropagation();
$("#heart").onclick = async () => {
  const it = items[cur]; const { error } = await db.from("fotos").update({ favorita: !it.favorita }).eq("id", it.id);
  if (!error){ it.favorita = !it.favorita; dirty = true; open(cur); }
};
$("#note").onclick = async () => {
  const it = items[cur], t = prompt("Legenda da foto:", it.legenda || ""); if (t === null) return;
  const { error } = await db.from("fotos").update({ legenda: t.trim() }).eq("id", it.id);
  if (!error){ it.legenda = t.trim(); dirty = true; open(cur); }
};
$("#del").onclick = async () => {
  const it = items[cur]; if (!confirm("Apagar esta foto para sempre?")) return;
  await db.storage.from("fotos").remove([it.path]); await db.from("fotos").delete().eq("id", it.id);
  dirty = true; $("#dlg").close();
};
$("#dlg").addEventListener("close", () => { if (dirty){ dirty = false; load(); } });
$("#favs").onclick = () => { onlyFav = !onlyFav; $("#favs").textContent = onlyFav ? "Todas" : "Favoritas"; toast(""); load(); };
$("#prev").onclick = e => { e.stopPropagation(); open(cur - 1); };
$("#next").onclick = e => { e.stopPropagation(); open(cur + 1); };
$("#dlg").onclick = () => $("#dlg").close();
document.addEventListener("keydown", e => { if ($("#dlg").open){ if (e.key === "ArrowLeft") open(cur - 1); if (e.key === "ArrowRight") open(cur + 1); } });

function shrink(file){
  return new Promise((ok, fail) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : fail(), "image/jpeg", .82);
    };
    img.onerror = fail; img.src = u;
  });
}

async function send(files){
  if (!files.length) return;
  const { data:{ user } } = await db.auth.getUser(); let n = 0;
  for (const file of files){
    toast(`Enviando ${++n} de ${files.length}…`);
    try {
      const blob = await shrink(file), path = `${user.id}/${Date.now()}-${n}.jpg`;
      const up = await db.storage.from("fotos").upload(path, blob, { contentType:"image/jpeg" }); if (up.error) throw up.error;
      const ins = await db.from("fotos").insert({ path }); if (ins.error) throw ins.error;
    } catch (err) { toast("Não foi possível enviar. Tente de novo."); return; }
  }
  toast(""); await load();
}
$("#cam").onclick = () => $("#fc").click();
$("#gal").onclick = () => $("#fg").click();
[$("#fc"), $("#fg")].forEach(i => i.onchange = () => { send([...i.files]); i.value = ""; });
document.addEventListener("visibilitychange", () => { if (!document.hidden && db && !$("#app").classList.contains("hide")) load(); });

init();
</script>
</body>
</html>
